<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Django Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 460px;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 24px;
            text-align: center;
        }

        /* Styles the <p> tags generated by {{ form.as_p }} */
        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"],
        form input[type="number"],
        form input[type="date"],
        form input[type="tel"],
        form input[type="url"],
        form select,
        form textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            color: #1f2937;
            background-color: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* Handles checkboxes and radio buttons cleanly */
        form input[type="checkbox"],
        form input[type="radio"] {
            width: auto;
            margin-right: 8px;
            accent-color: #2563eb;
        }

        /* Styles Django help_text */
        .helptext {
            display: block;
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 4px;
        }

        /* Styles Django validation error lists */
        .errorlist {
            list-style: none;
            color: #dc2626;
            font-size: 0.85rem;
            margin-bottom: 8px;
            padding: 8px 12px;
            background-color: #fef2f2;
            border-left: 3px solid #dc2626;
            border-radius: 4px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #2563eb;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background-color: #1d4ed8;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Student Registration</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
